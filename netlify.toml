[build]
  publish = "_site/"
  command = "npm run build "

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
	cache-control = '''
	max-age=3600,
	public'''

[[headers]]
  for = "/assets/*"
  [headers.values]
	cache-control = '''
	max-age=31536000,
	public,
	immutable'''
