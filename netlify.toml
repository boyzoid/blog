[build]
  publish = "_site/"
  command = "npm run build "

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
	cache-control = '''
	max-age=3600,
	public'''

# The giscus iframe loads the custom comment themes cross-origin
[[headers]]
  for = "/assets/css/*"
  [headers.values]
	Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
	cache-control = '''
	max-age=31536000,
	public,
	immutable'''
